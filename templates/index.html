<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Torneo de Boxeo - Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: -1;
        }

        .master-container {
            display: flex;
            flex-wrap: wrap;
            width: 90%;
            max-width: 1200px;
            background: rgba(20, 20, 20, 0.6);
            border: 2px solid #D4AF37;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(5px);
            overflow: hidden;
            z-index: 1;
        }

        .form-section {
            flex: 1;
            min-width: 350px;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header-title {
            color: #D4AF37;
            text-shadow: 2px 2px 4px #000;
            font-size: 2.5rem;
            font-weight: 900;
            margin: 0 0 10px 0;
        }

        .form-group {
            position: relative;
            margin-bottom: 25px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 10px;
            background: transparent;
            border: none;
            border-bottom: 2px solid #555;
            color: #fff;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-bottom: 2px solid #FFDF00;
        }

        .btn-gloria {
            background: linear-gradient(45deg, #B8860B, #FFDF00, #B8860B);
            color: #000;
            font-weight: 900;
            padding: 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.5s;
            width: 100%;
            margin-top: 10px;
        }

        .btn-gloria:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 223, 0, 0.8);
        }

        .botones-extra {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-extra {
            text-decoration: none;
            text-align: center;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid #D4AF37;
            color: #fff;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-extra:hover {
            background: #D4AF37;
            color: #000;
        }

        .video-section {
            flex: 1;
            min-width: 350px;
            background: #000;
            display: flex;
            align-items: center;
            border-left: 2px solid rgba(212, 175, 55, 0.3);
        }

        iframe {
            width: 100%;
            height: 100%;
            min-height: 400px;
            border: none;
        }
    </style>
</head>

<body>

    <video autoplay muted loop class="video-bg">
        <source src="https://cdn.pixabay.com/video/2020/05/24/40093-424883710_large.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="master-container">

        <div class="form-section">

            <h1 class="header-title">FIGHT NIGHT</h1>

            <p style="color:#aaa;">
             Módulo Principal - Registro rápido
            </p>

            <form action="/" method="POST">

                <div class="form-group">
                    <input type="text" name="documento" required placeholder="Documento">
                </div>

                <div class="form-group">
                    <input type="text" name="nombre" required placeholder="Nombre del Peleador">
                </div>

                <div class="form-group">
                    <input type="email" name="correo" required placeholder="Correo Electrónico">
                </div>

                <div class="form-group">
                    <input type="text" name="programa" required placeholder="Programa de Formación">
                </div>

                <div class="form-group">
                    <input type="text" name="ficha" required placeholder="Ficha">
                </div>

                <button type="submit" class="btn-gloria">
                 Registrar desde Inicio
                </button>

            </form>

            <div class="botones-extra">

                <a href="https://freepacman.org/" target="_blank" class="btn-extra">
                    Ir al Juego
                </a>

                <a href="/modulo_registro" class="btn-extra">
                    Consultar Registrados
                </a>

            </div>

        </div>

        <div class="video-section">
            <iframe
                src="https://www.youtube.com/embed/i4k7_v1MTqM?autoplay=1"
                title="YouTube video player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>

    </div>

</body>
</html>
