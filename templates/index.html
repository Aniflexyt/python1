<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Blackjack Casino - Inicio</title>
    <style>
        body { background: #0a0a0a; color: #d4af37; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .casino-card { background: #1a1a1a; padding: 40px; border: 2px solid #d4af37; border-radius: 15px; box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); text-align: center; width: 350px; }
        input { background: #000; color: #d4af37; border: 1px solid #d4af37; padding: 12px; width: 90%; margin: 10px 0; border-radius: 5px; }
        button { background: #d4af37; color: #000; border: none; padding: 15px 30px; margin-top: 20px; font-weight: bold; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
<div class="casino-card">
    <h1>BLACKJACK</h1>
    <form method="POST">
        <input type="text" name="documento" placeholder="Documento" required>
        <input type="text" name="nombre" placeholder="Nombre" required>
        <input type="text" name="programa" placeholder="Programa" required>
        <input type="text" name="ficha" placeholder="Ficha" required>
        <button type="submit">ENTRAR AL CASINO</button>
    </form>
</div>
</body>
</html>
