<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneo de Boxeo - Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900&display=swap" rel="stylesheet">
    <style>
        /* --- ESTILOS GENERALES --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #050505; /* Negro profundo */
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .master-container {
            display: flex;
            flex-wrap: wrap;
            width: 90%;
            max-width: 1200px;
            background: rgba(20, 20, 20, 0.8);
            border: 2px solid #D4AF37; /* Dorado */
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3), inset 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* --- COLUMNA IZQUIERDA (FORMULARIO) --- */
        .form-section {
            flex: 1;
            min-width: 350px;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header-title {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #D4AF37;
            text-shadow: 2px 2px 4px #000, 0 0 15px rgba(212, 175, 55, 0.5);
            margin-top: 0;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1rem;
            color: #aaaaaa;
            margin-bottom: 30px;
        }

        .form-group {
            position: relative;
            margin-bottom: 25px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 10px;
            background: transparent;
            border: none;
            border-bottom: 2px solid #555;
            color: #fff;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-bottom: 2px solid #FFDF00; /* Dorado brillante al enfocar */
            box-shadow: 0 5px 5px -5px rgba(255, 223, 0, 0.5);
        }

        .form-group label {
            position: absolute;
            top: 12px;
            left: 10px;
            color: #888;
            font-size: 1rem;
            pointer-events: none;
            transition: 0.3s ease all;
        }

        /* Animación del label cuando se escribe o se enfoca */
        .form-group input:focus ~ label,
        .form-group input:valid ~ label {
            top: -15px;
            left: 0;
            font-size: 0.8rem;
            color: #D4AF37;
            font-weight: bold;
        }

        .btn-gloria {
            background: linear-gradient(45deg, #B8860B, #FFDF00, #B8860B);
            background-size: 200% auto;
            color: #000;
            font-weight: 900;
            font-size: 1.2rem;
            text-transform: uppercase;
            padding: 15px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.5s;
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(255, 223, 0, 0.4);
        }

        .btn-gloria:hover {
            background-position: right center;
            box-shadow: 0 0 25px rgba(255, 223, 0, 0.8);
            transform: scale(1.02);
        }

        /* --- COLUMNA DERECHA (VIDEO) --- */
        .video-section {
            flex: 1;
            min-width: 350px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-left: 2px solid rgba(212, 175, 55, 0.3);
        }

        .video-container {
            width: 100%;
            height: 100%;
            min-height: 400px; /* Asegura que el video tenga buen tamaño */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Ajustes para celulares */
        @media (max-width: 768px) {
            .master-container {
                flex-direction: column;
                margin: 20px 0;
            }
            .video-section {
                border-left: none;
                border-top: 2px solid rgba(212, 175, 55, 0.3);
                height: 300px;
                min-height: auto;
            }
        }
    </style>
</head>
<body>

    <div class="master-container">
        
        <div class="form-section">
            <h1 class="header-title">FIGHT NIGHT</h1>
            <p class="subtitle">Registra tus datos antes de subir al ring</p>

            <form action="/juego" method="POST">
                <div class="form-group">
                    <input type="text" name="documento" required autocomplete="off">
                    <label>Documento</label>
                </div>

                <div class="form-group">
                    <input type="text" name="nombre" required autocomplete="off">
                    <label>Nombre del Peleador</label>
                </div>

                <div class="form-group">
                    <input type="email" name="correo" required autocomplete="off">
                    <label>Correo Electrónico</label>
                </div>

                <div class="form-group">
                    <input type="text" name="programa" required autocomplete="off">
                    <label>Programa de Formación</label>
                </div>

                <div class="form-group">
                    <input type="text" name="ficha" required autocomplete="off">
                    <label>Ficha</label>
                </div>

                <button type="submit" class="btn-gloria">Entrar al Ring</button>
            </form>
        </div>

        <div class="video-section">
            <div class="video-container">
                <iframe 
                    src="https://www.youtube.com/embed/ScMzIvxBSi4?autoplay=1&mute=1&loop=1&playlist=ScMzIvxBSi4" 
                    title="Video de Boxeo Motivacional" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>

    </div>

</body>
</html>
