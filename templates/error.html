<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Error del Servidor</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f8d7da; 
            color: #721c24; 
            display: flex; 
            flex-direction: column;
            height: 100vh; 
            justify-content: center; 
            align-items: center; 
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .error-card { 
            background: white; 
            padding: 40px; 
            border-radius: 10px; 
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1); 
            max-width: 500px; 
            text-align: center;
            border: 2px solid #f5c6cb;
        }
        h1 { margin-top: 0; color: #dc3545; }
        .details { 
            background: #f8f9fa; 
            padding: 15px; 
            border-radius: 5px; 
            font-family: monospace; 
            text-align: left; 
            overflow-x: auto; 
            margin-top: 20px;
            border: 1px solid #ddd;
            color: #333;
        }
        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 20px;
            background: #dc3545;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <h1>¡Ups! Problema de Conexión</h1>
        <p><strong>{{ mensaje_error }}</strong></p>
        <p>El servidor no pudo establecer comunicación con la base de datos.</p>
        
        <div class="details">
            <strong>Detalle técnico (Error Capturado):</strong><br><br>
            {{ detalle }}
        </div>
        
        <a href="/" class="btn">Volver al Inicio</a>
    </div>
</body>
</html>
