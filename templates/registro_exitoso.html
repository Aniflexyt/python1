<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro Exitoso</title>

<style>

body{
    margin:0;
    font-family:'Montserrat',sans-serif;
    background:#000;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.contenedor{
    text-align:center;
    background:rgba(20,20,20,.8);
    padding:40px;
    border-radius:15px;
    border:2px solid gold;
    box-shadow:0 0 20px rgba(255,215,0,.5);
}

h1{
    color:#FFD700;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    background:gold;
    color:black;
    text-decoration:none;
    border-radius:5px;
    font-weight:bold;
}

.btn:hover{
    transform:scale(1.05);
}

</style>
</head>
<body>

<div class="contenedor">

    <h1>Registro Exitoso</h1>

    <p>
        El estudiante fue registrado correctamente en la base de datos.
    </p>

    <a href="/" class="btn">
        Volver al Inicio
    </a>

    <a href="/registrados" class="btn">
        Consultar Registrados
    </a>

</div>

</body>
</html>
