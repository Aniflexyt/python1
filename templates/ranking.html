<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Salón de la Fama</title>
    <style>
        body { background: #111; color: white; font-family: Arial; padding: 40px; }
        .container { max-width: 800px; margin: auto; background: #222; padding: 30px; border-radius: 10px; border: 2px solid #D4AF37; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; border-bottom: 1px solid #444; }
        th { background: #D4AF37; color: black; }
        h1 { color: #D4AF37; }
        a { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #D4AF37; color: black; text-decoration: none; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        {% if mensaje %}
        <h2 style="color: #4CAF50;">{{ mensaje }}</h2>
        {% endif %}
        
        <h1>🏆 SALÓN DE LA FAMA 🏆</h1>
        <table>
            <tr><th>Nombre</th><th>Programa</th><th>Ficha</th><th>Puntaje</th></tr>
            {% for j in jugadores %}
            <tr>
                <td>{{ j[0] }}</td>
                <td>{{ j[2] }}</td>
                <td>{{ j[3] }}</td>
                <td style="color: #FFDF00; font-weight: bold;">{{ j[1] }}</td>
            </tr>
            {% endfor %}
        </table>
        
        <a href="/">Volver al Inicio</a>
    </div>
</body>
</html>
