<!DOCTYPE html>
<html>
<head>
    <title>PAC-MAN ARCADE</title>
    <script src="https://unpkg.com/kaboom@3000.0.1/dist/kaboom.js"></script>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { border: 4px solid #1919ff; }
    </style>
</head>
<body>
    <script>
        kaboom({
            background: [0, 0, 0],
            width: 448,
            height: 496,
        });

        // Carga de tus sprites (puedes reemplazar estas URLs por tus propios archivos .png)
        loadSprite("pacman", "https://i.imgur.com/gK0r8bE.png");
        loadSprite("ghost", "https://i.imgur.com/k6lP4dC.png");

        scene("game", () => {
            const player = add([sprite("pacman"), pos(224, 380), area(), body()]);
            
            // Lógica de movimiento y colisiones...
            
            // Cuando Pac-Man muere:
            onCollide("pacman", "ghost", () => {
                const finalScore = 1200; // Aquí iría tu variable de puntaje real
                sendScoreToFlask(finalScore);
            });
        });

        function sendScoreToFlask(score) {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/guardar';
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'puntaje_final';
            input.value = score;
            form.appendChild(input);
            document.body.appendChild(form);
            form.submit();
        }

        go("game");
    </script>
</body>
</html>
