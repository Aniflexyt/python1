<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>En el Ring</title>
    <style>
        body { background: #111; color: white; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .ring { background: #222; padding: 40px; border-radius: 10px; border: 3px solid #D4AF37; text-align: center; box-shadow: 0 0 30px rgba(212, 175, 55, 0.5); width: 400px; }
        input { width: 90%; padding: 15px; margin: 20px 0; font-size: 18px; text-align: center; background: #000; color: #D4AF37; border: 1px solid #D4AF37; border-radius: 5px; }
        button { width: 100%; padding: 15px; background: #D4AF37; color: black; font-weight: bold; font-size: 18px; border: none; cursor: pointer; border-radius: 5px; }
        button:hover { background: #FFDF00; }
        .msg { color: #FFDF00; font-size: 1.2rem; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="ring">
        <h2 style="color: white; margin-top:0;">Luchador: <span style="color: #D4AF37;">{{ nombre }}</span></h2>
        <p class="msg">{{ mensaje }}</p>
        
        <form method="POST" action="/juego">
            <input type="number" name="intento" placeholder="Lanza tu golpe (Número)" required autofocus>
            <button type="submit">¡GOLPEAR!</button>
        </form>
    </div>
</body>
</html>
