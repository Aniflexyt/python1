<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FIGHT NIGHT - Gestión de Peleadores</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            background: #000000;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: -1;
        }

        h1 {
            text-align: center;
            color: #D4AF37;
            text-shadow: 2px 2px 4px #000;
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .btn-volver {
            display: inline-block;
            text-decoration: none;
            color: #D4AF37;
            font-weight: bold;
            margin-bottom: 25px;
            transition: 0.3s;
        }

        .btn-volver:hover {
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.8);
        }

        .split-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            max-width: 1400px;
            margin: 0 auto;
            z-index: 1;
        }

        .section-box {
            background: rgba(20, 20, 20, 0.7);
            border: 2px solid #D4AF37;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(5px);
            box-sizing: border-box;
        }

        .left-panel {
            flex: 1;
            min-width: 320px;
            max-width: 420px;
        }

        .right-panel {
            flex: 2;
            min-width: 500px;
        }

        h2 {
            color: #D4AF37;
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 25px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 10px;
            background: transparent;
            border: none;
            border-bottom: 2px solid #555;
            color: #fff;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-bottom: 2px solid #FFDF00;
        }

        .btn-gloria {
            background: linear-gradient(45deg, #B8860B, #FFDF00, #B8860B);
            color: #000;
            font-weight: 900;
            padding: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.5s;
            width: 100%;
        }

        .btn-gloria:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(255, 223, 0, 0.6);
        }

        .search-box {
            width: 100%;
            padding: 12px;
            background: rgba(10, 10, 10, 0.6);
            border: 1px solid #D4AF37;
            border-radius: 5px;
            color: #fff;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #D4AF37;
            color: #000;
            padding: 12px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        td {
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 12px;
            text-align: center;
            font-size: 0.9rem;
            background: rgba(10, 10, 10, 0.4);
        }

        tr:nth-child(even) td {
            background: rgba(25, 25, 25, 0.4);
        }

        .btn-borrar {
            color: #ff5555;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-borrar:hover {
            color: #ff1111;
            text-shadow: 0 0 8px rgba(255,85,85,0.6);
        }
    </style>
</head>
<body>

    <video autoplay muted loop class="video-bg">
        <source src="https://cdn.pixabay.com/video/2020/05/24/40093-424883710_large.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <h1>[PÁGINA 2] MÓDULO DE GESTIÓN</h1>
    <div style="max-width: 1400px; margin: 0 auto;">
        <a href="/" class="btn-volver">⬅ Volver al Módulo Principal (Página 1)</a>
    </div>

    <div class="split-container">
        
        <div class="section-box left-panel">
            <h2>b) Registro de Usuario</h2>
            <form method="POST" action="/modulo_registro">
                <div class="form-group"><input type="text" name="documento" required placeholder="Documento"></div>
                <div class="form-group"><input type="text" name="nombre" required placeholder="Nombre del Peleador"></div>
                <div class="form-group"><input type="email" name="correo" required placeholder="Correo Electrónico"></div>
                <div class="form-group"><input type="text" name="programa" required placeholder="Programa de Formación"></div>
                <div class="form-group"><input type="text" name="ficha" required placeholder="Ficha"></div>
                <button type="submit" class="btn-gloria">Guardar Peleador</button>
            </form>
        </div>

        <div class="section-box right-panel">
            <h2>c) Consulta de Información Embebida</h2>
            
            <input type="text" id="buscador" class="search-box" onkeyup="filtrarTabla()" placeholder="🔍 Buscar peleador por nombre o documento...">
            
            <table id="tablaEstudiantes">
                <thead>
                    <tr>
                        <th>Documento</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Programa</th>
                        <th>Ficha</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    {% for est in estudiantes %}
                    <tr>
                        <td>{{ est[0] }}</td>
                        <td>{{ est[1] }}</td>
                        <td>{{ est[2] }}</td>
                        <td>{{ est[3] }}</td>
                        <td>{{ est[4] }}</td>
                        <td>
                            <a class="btn-borrar" href="/eliminar/{{ est[0] }}" onclick="return confirm('¿Deseas dar de baja a este peleador del torneo?')">🗑 Eliminar</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

    </div>

    <script>
        function filtrarTabla() {
            let input = document.getElementById("buscador");
            let filtro = input.value.toLowerCase();
            let tabla = document.getElementById("tablaEstudiantes");
            let filas = tabla.getElementsByTagName("tr");

            for (let i = 1; i < filas.length; i++) {
                let textoFila = filas[i].textContent.toLowerCase();
                if (textoFila.indexOf(filtro) > -1) {
                    filas[i].style.display = "";
                } else {
                    filas[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
